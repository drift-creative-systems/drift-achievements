# On each published GitHub release: checks the version numbers agree, builds
# drift-achievements.zip (the app plus worker/) from .distignore and attaches
# it to the release.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  SLUG: drift-achievements

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          app=$(sed -nE "s/^export const APP_VERSION = '([^']+)'.*/\1/p" js/config.js | head -1)
          worker=$(sed -nE 's/^\s*"version": "([^"]+)".*/\1/p' worker/package.json | head -1)
          tag="${TAG#v}"
          echo "Tag: $tag  APP_VERSION: $app  worker/package.json: $worker"
          if [ "$tag" != "$app" ] || [ "$tag" != "$worker" ]; then
            echo "::error::Release tag ($tag) must match APP_VERSION in js/config.js and the version in worker/package.json."
            exit 1
          fi
          if ! grep -qE "^## \[$tag\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$tag]' section."
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p "build/$SLUG"
          rsync -a ./ "build/$SLUG/" --exclude-from=.distignore
          cd build && zip -rq "$SLUG.zip" "$SLUG"

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "build/$SLUG.zip" --clobber
